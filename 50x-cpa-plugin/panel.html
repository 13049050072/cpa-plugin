<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>50x</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{acc:'#7c5cff'}}}};
(function(){
  const sync=()=>{try{
    const p=window.parent&&window.parent.document&&window.parent.document.documentElement;
    const t=(p&&p.getAttribute('data-theme'))||localStorage.getItem('cli-proxy-theme')||'';
    document.documentElement.classList.toggle('dark', t==='dark');
  }catch(e){}};
  sync();
  try{new MutationObserver(sync).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
})();
</script>
</head>
<body class="min-h-full m-0 bg-stone-50 text-stone-800 dark:bg-stone-900 dark:text-stone-100 text-sm antialiased overflow-x-hidden">
<div class="max-w-6xl mx-auto p-4 sm:p-6 min-w-0">
  <div class="flex flex-wrap items-end justify-between gap-3 mb-4 min-w-0">
    <div class="min-w-0">
      <h1 class="text-xl font-semibold truncate">50x</h1>
      <p class="text-xs text-stone-500 dark:text-stone-400 truncate">
        <a class="text-sky-600 dark:text-sky-400 hover:underline" href="https://ai.50x.energy/dashboard" target="_blank" rel="noreferrer">dashboard</a>
        · 请求/token 本地统计 · 余额/花费来自 /api/billing + /api/usage（点卡片刷新）
      </p>
    </div>
    <div class="flex gap-2 shrink-0">
      <button type="button" class="px-3 py-1.5 rounded-lg bg-stone-200 dark:bg-stone-700 hover:bg-stone-300 dark:hover:bg-stone-600" onclick="openImport()">导入</button>
      <button type="button" id="refreshBtn" class="px-3 py-1.5 rounded-lg bg-acc text-white hover:opacity-90 disabled:opacity-50" onclick="reload()">刷新</button>
    </div>
  </div>

  <div id="authBox" class="hidden mb-4 rounded-xl border border-stone-200 dark:border-stone-700 bg-white dark:bg-stone-800 p-4 min-w-0">
    <p class="text-xs text-stone-500 mb-2">需要 CPA management key</p>
    <div class="flex gap-2 min-w-0">
      <input id="keyInput" type="password" class="flex-1 min-w-0 rounded-lg border border-stone-200 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 px-3 py-2" placeholder="management key">
      <button type="button" class="shrink-0 px-3 py-2 rounded-lg bg-acc text-white" onclick="saveKey()">连接</button>
    </div>
  </div>

  <div id="err" class="hidden mb-3 rounded-lg bg-red-50 dark:bg-red-950/40 text-red-700 dark:text-red-300 px-3 py-2 break-words"></div>

  <div id="summary" class="hidden mb-4 grid grid-cols-2 sm:grid-cols-4 gap-2 min-w-0"></div>
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 min-w-0"></div>
</div>

<div id="importModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-lg rounded-xl bg-white dark:bg-stone-800 p-4 shadow-xl">
    <h2 class="font-semibold mb-1">导入 API key</h2>
    <p class="text-xs text-stone-500 mb-3">粘贴 sk-50x-… 或完整 auth JSON（带 password/session 才能查余额）。</p>
    <textarea id="importText" rows="4" class="w-full rounded-lg border border-stone-200 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 px-3 py-2 font-mono text-xs" placeholder="sk-50x-..."></textarea>
    <div id="importErr" class="hidden mt-2 text-xs text-red-600 break-words"></div>
    <div class="flex justify-end gap-2 mt-4">
      <button type="button" class="px-3 py-1.5 rounded-lg bg-stone-200 dark:bg-stone-700" onclick="closeImport()">取消</button>
      <button type="button" id="importBtn" class="px-3 py-1.5 rounded-lg bg-acc text-white" onclick="doImport()">导入</button>
    </div>
  </div>
</div>

<script>
const MANAGEMENT_BASE_PATH=__NM_MANAGEMENT_BASE_PATH_JSON__;
const API=MANAGEMENT_BASE_PATH+"/plugins/50x";
const ENC_PREFIX="enc::v1::", SECRET_SALT="cli-proxy-api-webui::secure-storage", PANEL_STORE="cli-proxy-auth", SS_KEY="50x-mgmt-key";
function _enc(t){return new TextEncoder().encode(t)}
function _dec(b){return new TextDecoder().decode(b)}
function _keyBytes(){try{return _enc(SECRET_SALT+"|"+location.host+"|"+navigator.userAgent)}catch(e){return _enc(SECRET_SALT)}}
function _xor(d,k){const r=new Uint8Array(d.length);for(let i=0;i<d.length;i++)r[i]=d[i]^k[i%k.length];return r}
function _b64d(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function deobfuscate(p){if(!p||!p.startsWith(ENC_PREFIX))return p;try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)),_keyBytes()))}catch(e){return p}}
function isEmbedded(){try{return window.self!==window.top}catch(e){return true}}
function readPanelKey(){if(!isEmbedded())return null;let raw;try{raw=localStorage.getItem(PANEL_STORE)}catch(e){return null}
  if(!raw)return null;try{const p=JSON.parse(deobfuscate(raw));const st=(p&&p.state)||p||{};return typeof st.managementKey==="string"?st.managementKey:null}catch(e){return null}}
(function(){let u;try{u=new URL(location.href)}catch(e){return}const k=u.searchParams.get("key");if(!k)return;try{sessionStorage.setItem(SS_KEY,k)}catch(e){}u.searchParams.delete("key");history.replaceState(null,"",u.pathname+u.search)})();
function getKey(){try{return sessionStorage.getItem(SS_KEY)||readPanelKey()}catch(e){return readPanelKey()}}
function saveKey(){const v=document.getElementById("keyInput").value.trim();if(!v)return;try{sessionStorage.setItem(SS_KEY,v)}catch(e){}document.getElementById("authBox").classList.add("hidden");load()}
function showAuth(){document.getElementById("authBox").classList.remove("hidden")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showErr(m){const e=document.getElementById("err");if(!m){e.classList.add("hidden");return}e.textContent=m;e.classList.remove("hidden")}
async function api(path,opts={},retry=true){
  const k=getKey();
  const r=await fetch(API+path,{...opts,credentials:"omit",headers:{...(opts.headers||{}),...(k?{Authorization:"Bearer "+k}:{}),...(opts.body?{"content-type":"application/json"}:{})}});
  if(r.status===401||r.status===403){
    if(retry){try{sessionStorage.removeItem(SS_KEY)}catch(e){}const fresh=readPanelKey();if(fresh&&fresh!==k)return api(path,opts,false)}
    showAuth();throw new Error("management key 无效")
  }
  const t=await r.text();
  let d;try{d=JSON.parse(t)}catch(e){throw new Error(t.slice(0,200))}
  if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
  return d;
}
function num(v){return typeof v==="number"?v.toLocaleString():"—"}
function money(v){const n=Number(v);return isFinite(v)&&v!==""?"$"+n.toFixed(2):"—"}
// 和 50x 站点的 br() 一致：9 位小数去掉末尾 0，不做“好看”的两位四舍五入
function moneyRaw(v){const n=Number(v);if(v===""||v===null||v===undefined||!isFinite(n))return "—";
  return "$"+n.toFixed(9).replace(/\.?0+$/,"").replace(/\.$/,"")}
function cost(v){const n=Number(v);if(v===undefined||v===null||v===""||!isFinite(n))return "—";if(n===0)return "$0";return "$"+n.toFixed(n<0.01?6:2)}
function lastSeen(ts){
  if(!ts)return "—";
  const ms=Date.now()-ts*1000;
  if(ms<60000)return Math.max(1,Math.round(ms/1000))+"s 前";
  if(ms<3600000)return Math.round(ms/60000)+"m 前";
  if(ms<86400000)return Math.round(ms/3600000)+"h 前";
  return Math.round(ms/86400000)+"d 前";
}

// ---------------------------------------------------------------- 卡片
function badge(a){
  if(a.disabled)return ['停用','bg-stone-200 text-stone-600 dark:bg-stone-700 dark:text-stone-300'];
  if(a.state==='invalid')return ['失效','bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-200'];
  if(a.state==='ok')return ['可用','bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-200'];
  return ['未知','bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-200'];
}
function tile(label,value,sub,cls,tip){
  return `<div class="rounded-lg bg-stone-100 dark:bg-stone-900/60 p-2 min-w-0" title="${esc(tip||'')}">
    <div class="text-[10px] text-stone-500 truncate">${esc(label)}</div>
    <div class="text-base font-semibold tabular-nums truncate ${cls||''}">${value}</div>
    <div class="text-[10px] text-stone-400 truncate">${esc(sub||'')}</div>
  </div>`;
}
function cardHTML(a){
  const l=a.local||{}, b=a.balance||{};
  const [lab,bcls]=badge(a);
  const bal=b.balance_usd?moneyRaw(b.balance_usd):'—';
  return `<div class="text-left w-full min-w-0 overflow-hidden rounded-xl border border-stone-200 dark:border-stone-700 bg-white dark:bg-stone-800 p-4 cursor-pointer hover:border-[#7c5cff] transition-colors" data-id="${esc(a.auth_index)}" title="点击刷新余额">
    <div class="flex items-start gap-2 min-w-0">
      <div class="min-w-0 flex-1">
        <div class="font-medium truncate" title="${esc(a.email||a.nickname||a.uid||a.name)}">${esc(a.email||a.nickname||a.uid||a.name||'key')}</div>
        <div class="text-[11px] font-mono text-stone-500 truncate">${esc(a.key_prefix||'')}</div>
      </div>
      <span class="shrink-0 max-w-[40%] truncate text-[11px] font-semibold px-2 py-0.5 rounded-full ${bcls}">${lab}</span>
    </div>
    <div class="mt-3 grid grid-cols-3 gap-2 min-w-0">
      ${tile('余额',`<span class="text-[13px]">${bal}</span>`,b.at?lastSeen(b.at):'点我刷新','',b.balance_usd||'')}
      ${tile('今日请求',num(l.today),'累计 '+num(l.total))}
      ${tile('今日 Token',num(l.tokens_today),'累计 '+num(l.tokens_total))}
    </div>
    <div class="mt-2 flex items-center justify-between gap-2 text-[11px] text-stone-500 min-w-0">
      <span class="truncate">最后使用 ${lastSeen(l.last)}</span>
      <span class="shrink-0 ${l.errors?'text-rose-500':''}">错误 ${num(l.errors)}</span>
    </div>
    <div class="mt-1 flex items-center justify-between gap-2 text-[11px] text-stone-500 min-w-0">
      <span>今日花费 <span class="tabular-nums">${cost(b.cost_today)}</span></span>
      <span>7 天 <span class="tabular-nums">${cost(b.cost_7d)}</span> · ${num(b.requests_7d)} 次</span>
    </div>
    ${b.error?`<p class="mt-2 text-[11px] text-rose-500 break-words line-clamp-2" title="${esc(b.error)}">${esc(b.error)}</p>`:''}
  </div>`;
}

let ACCOUNTS=[], autoRetried=false;
function reload(){autoRetried=false;load()}

function renderSummary(){
  const box=document.getElementById("summary");
  box.classList.remove("hidden");
  const ok=ACCOUNTS.filter(a=>a.state==='ok'&&!a.disabled).length;
  const withBal=ACCOUNTS.filter(a=>a.balance&&a.balance.balance_usd);
  const total=withBal.reduce((s,a)=>s+Number(a.balance.balance_usd||0),0);
  const today=ACCOUNTS.reduce((s,a)=>s+Number((a.local||{}).today||0),0);
  box.innerHTML=[
    ['账号',ACCOUNTS.length,ok+' 可用'],
    ['可用',ok,ACCOUNTS.length+' 个'],
    ['总余额',withBal.length?moneyRaw(total):'—',withBal.length===ACCOUNTS.length?ACCOUNTS.length+' 个账号合计':withBal.length+'/'+ACCOUNTS.length+' 个有凭据'],
    ['今日请求',today.toLocaleString(),'本地统计'],
  ].map(([k,v,sub])=>`<div class="rounded-lg bg-stone-100 dark:bg-stone-800 p-3 min-w-0" title="${esc(String(total))}"><div class="text-[10px] text-stone-500">${k}</div><div class="text-lg font-semibold tabular-nums truncate">${v}</div><div class="text-[10px] text-stone-400 truncate">${esc(sub||'')}</div></div>`).join('');
}

function renderGrid(){
  const g=document.getElementById("grid");
  if(!ACCOUNTS.length){g.innerHTML='<div class="col-span-full text-center text-stone-500 py-10">还没有 50x key，点「导入」粘贴 sk-50x-…</div>';return}
  g.innerHTML=ACCOUNTS.map(cardHTML).join("");
}

async function fillOne(a,force){
  try{
    const u=await api("/usage",{method:"POST",body:JSON.stringify({auth_index:a.auth_index,login:true,refresh:!!force})});
    a.local=u.local;a.state=u.state||"unknown";a.balance=u.balance;
  }catch(e){a.state="unknown"}
}

async function load(){
  const btn=document.getElementById("refreshBtn");btn.disabled=true;showErr("");
  try{
    const d=await api("/accounts");
    ACCOUNTS=(d.accounts||[]).map(a=>({...a}));
    renderSummary();renderGrid();
    await Promise.all(ACCOUNTS.map(a=>fillOne(a,false)));
    renderSummary();renderGrid();
    // 余额是后台刷新的：第一次打开触发，6 秒后再拉一次拿结果
    if(!autoRetried && ACCOUNTS.some(a=>!a.balance||!a.balance.at)){autoRetried=true;setTimeout(load,6000)}
  }catch(e){showErr(e.message)}
  finally{btn.disabled=false}
}

document.getElementById("grid").addEventListener("click",async e=>{
  const el=e.target.closest("[data-id]");if(!el)return;
  const a=ACCOUNTS.find(x=>x.auth_index===el.getAttribute("data-id"));if(!a)return;
  el.style.opacity=.55;
  await fillOne(a,true);
  renderSummary();renderGrid();
});

function openImport(){const m=document.getElementById("importModal");m.classList.remove("hidden");m.classList.add("flex")}
function closeImport(){const m=document.getElementById("importModal");m.classList.add("hidden");m.classList.remove("flex");document.getElementById("importErr").classList.add("hidden")}
async function doImport(){
  const text=document.getElementById("importText").value.trim();
  const err=document.getElementById("importErr");
  if(!text){err.textContent="请粘贴 key";err.classList.remove("hidden");return}
  const btn=document.getElementById("importBtn");btn.disabled=true;
  try{
    const d=await api("/import",{method:"POST",body:JSON.stringify({key:text})});
    if(!d.success)throw new Error(d.error||"导入失败");
    document.getElementById("importText").value="";
    closeImport();await load();
  }catch(e){err.textContent=e.message;err.classList.remove("hidden")}
  finally{btn.disabled=false}
}
load();
</script>
</body>
</html>
